<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NIK</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
        }

        #button-container {
            position: relative;
            z-index: 10;
        }

        .cyber-button {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, #0f0f13 0%, #1a1a2e 100%);
            box-shadow: 
                0 0 20px rgba(0, 255, 255, 0.4),
                inset 0 0 20px rgba(0, 255, 255, 0.2),
                0 0 50px rgba(255, 0, 255, 0.2);
            color: #00ffff;
            font-size: 32px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 4px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            text-shadow: 0 0 10px #00ffff;
        }

        .cyber-button::before {
            content: '';
            position: absolute;
            top: -4px;
            left: -4px;
            right: -4px;
            bottom: -4px;
            border-radius: 50%;
            border: 2px solid transparent;
            background: linear-gradient(135deg, #00ffff, #ff00ff) border-box;
            -webkit-mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            opacity: 0.7;
            transition: opacity 0.3s ease;
        }

        .cyber-button:hover {
            box-shadow: 
                0 0 30px rgba(0, 255, 255, 0.6),
                inset 0 0 30px rgba(0, 255, 255, 0.3),
                0 0 70px rgba(255, 0, 255, 0.4);
            transform: scale(1.05);
        }

        .cyber-button:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>
    <div id="button-container">
        <button class="cyber-button" id="nikButton">NIK</button>
    </div>
    <div id="canvas-container">
        <canvas id="fireworksCanvas"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('fireworksCanvas');
        const ctx = canvas.getContext('2d');
        const button = document.getElementById('nikButton');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let particles = [];

        class Particle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.angle = Math.random() * Math.PI * 2;
                this.velocity = Math.random() * 6 + 2;
                this.friction = 0.95;
                this.gravity = 0.05;
                this.alpha = 1;
                this.fade = Math.random() * 0.015 + 0.005;
                this.color = Math.random() > 0.5 ? '#00ffff' : '#ff00ff';
                this.size = Math.random() * 3 + 1;
                
                this.velocityX = Math.cos(this.angle) * this.velocity;
                this.velocityY = Math.sin(this.angle) * this.velocity;
            }

            update() {
                this.velocity *= this.friction;
                this.velocityX = Math.cos(this.angle) * this.velocity;
                this.velocityY += this.gravity;
                this.x += this.velocityX;
                this.y += this.velocityY;
                this.alpha -= this.fade;
            }

            draw() {
                ctx.globalAlpha = this.alpha;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.closePath();
            }
        }

        button.addEventListener('click', (e) => {
            const rect = button.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;

            for (let i = 0; i < 500; i++) {
                particles.push(new Particle(centerX, centerY));
            }
        });

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

             particles.forEach((particle, index) => {
                if (particle.alpha <= 0) {
                    particles.splice(index, 1);
                } else {
                    particle.update();
                    particle.draw();
                }
            });

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
